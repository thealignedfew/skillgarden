<!-- Stagecraft 0.4.0 (snippet). One include that turns an HTML artifact page into a small self-contained app.
     Three marked parts, copy all three:
       1. PB:STYLE  : one style block, first thing in the page content (the neutral palette named "default", then the components);
       2. PB:HEADER : markup, first thing in the page content (header box, detail rail, Options panel, tooltip, comment box);
       3. PB:SCRIPT : one script block, last thing in the page content.
     Before PB:SCRIPT the page defines var PB_CONFIG = {...} (key, header, log, glossary, tooltips, commit_delay_s, signer_labels,
     rulings_closed, currency, answers_path, detail, width, tabs, defaults). defaults is the output of options.py page-config (the reader's settings);
     every key is optional. Everything else is driven by data attributes in plain HTML.
     0.3.2: PB_CONFIG.tabs [{ id, label }, ...] names several tabs; a block of the page belongs to one by data-pb-tab="id" (top level of the content); the Log tab stays last; a tab with id "method" is the Method tab (fixed section ids method-purpose, method-derived, method-sources, method-assumed, method-limits, method-open, method-rebuild; real text in the source).
     0.3.3: Options comes before Shortcuts everywhere (header, floating tabs, strip); the Shortcuts control (tab, header button, the ? key) toggles a list of the shortcuts on screen under the control (there is no Shortcuts panel); Options has an entry "Bind Shortcuts" where the reader changes any key (stored per reader against the shortcut's stable id; PB.keys.add takes { id, when, order }); new shortcuts for tabs, open items, review rows, theme, CSV and hidden columns; the author status counts the publish time as a first sign of life.
     0.3.4: ONE header, ONE detail slider, ONE Pin to top button. Stagecraft replaces the older artifact header of the parley skill (the same ids: ah, ah-rail, ah-lvl, ah-pin); a page never carries both. scripts/inject_stagecraft.py removes the older
     header; if a hand-made page still holds one, this script keeps its own, hides the other (PB.layout.report().foreign says so) and adds no second Pin to top button. The open list of shortcuts never covers the detail slider: the slider moves down
     below it, or, when the window is too short for both, is held at the top while the list is open and goes back when it closes (not stored as the reader's choice).
     Tag secondary blocks l1, l2 or l3 (the lowest detail level that shows them). The page works with no window.claude at all:
     whatever needs a capability turns read-only and says why in one line. Declare capabilities db, user (scope profile) and
     comments when publishing so rulings, answers, option mirroring and comments can work. -->
<!-- PB:STYLE -->
<style>
/* Stagecraft 0.4.0. Tokens first: one neutral palette called "default", light and dark. Every text color is at least 7:1 on --bg and --surface, every border at least 3:1 (tests/contrast_check.py computes it). The page's own colors use these tokens: --bg --surface --fg --muted --line --accent --accent-soft --ask --ask-soft --ok --warn --warn-soft. */
:root { --bg: #f3f6fa; --surface: #ffffff; --fg: #14181f; --muted: #444c58; --line: #67727f; --accent: #0f4a80; --accent-soft: #dcebf8; --ask: #951a0a; --ask-soft: #fbe6e3; --ok: #235521; --warn: #6e4300; --warn-soft: #fbefd5; --shade: rgba(10, 14, 20, .45); --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace; color-scheme: light; }
:root[data-contrast="standard"] { --muted: #5a6573; --accent: #1b62a8; --ask: #b3261a; --ok: #2d6a2a; --warn: #8a5600; }
:root { --ws-orange: #b34a00; --ws-purple: #7a3fb0; --ws-green: #2c7a2a; --ws-yellow: #8a6a00; --ws-blue: #1e6bb8; --ws-pink: #b83280; }
:root[data-ws="default"] { --bg: #f3f6fa; --surface: #ffffff; --fg: #14181f; --muted: #444c58; --line: #67727f; --accent: #0f4a80; --accent-soft: #dcebf8; --ask: #951a0a; --ask-soft: #fbe6e3; --ok: #235521; --warn: #6e4300; --warn-soft: #fbefd5; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-ptheme="light"]):not([data-theme="light"]) { --bg: #0b0f14; --surface: #131a22; --fg: #f2f5f8; --muted: #c4ccd6; --line: #6a86a3; --accent: #6db8ff; --accent-soft: #0b2744; --ask: #ff9b6b; --ask-soft: #40200f; --ok: #89d185; --warn: #f0b35e; --warn-soft: #3a2a14; --shade: rgba(0, 0, 0, .6); color-scheme: dark; } }
:root[data-ptheme="dark"], :root[data-theme="dark"]:not([data-ptheme="light"]) { --bg: #0b0f14; --surface: #131a22; --fg: #f2f5f8; --muted: #c4ccd6; --line: #6a86a3; --accent: #6db8ff; --accent-soft: #0b2744; --ask: #ff9b6b; --ask-soft: #40200f; --ok: #89d185; --warn: #f0b35e; --warn-soft: #3a2a14; --shade: rgba(0, 0, 0, .6); color-scheme: dark; }
@media (prefers-color-scheme: dark) { :root[data-contrast="standard"]:not([data-ptheme="light"]):not([data-theme="light"]) { --muted: #8794a5; --accent: #6db8ff; --ask: #ff9b6b; --ok: #89d185; --warn: #f0b35e; } }
@media (prefers-color-scheme: dark) { :root:not([data-ptheme="light"]):not([data-theme="light"]) { --ws-orange: #ff9a4d; --ws-purple: #c79bff; --ws-green: #7fd67a; --ws-yellow: #e8c547; --ws-blue: #6db8ff; --ws-pink: #ff8fc8; } }
:root[data-contrast="standard"][data-ptheme="dark"], :root[data-contrast="standard"][data-theme="dark"]:not([data-ptheme="light"]) { --muted: #8794a5; --accent: #6db8ff; --ask: #ff9b6b; --ok: #89d185; --warn: #f0b35e; }
:root[data-ptheme="dark"], :root[data-theme="dark"]:not([data-ptheme="light"]) { --ws-orange: #ff9a4d; --ws-purple: #c79bff; --ws-green: #7fd67a; --ws-yellow: #e8c547; --ws-blue: #6db8ff; --ws-pink: #ff8fc8; }
html, body { background: var(--bg); color: var(--fg); }
body { margin: 0; font: 15px/1.55 var(--body); }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, th:focus-visible, [tabindex]:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
kbd { font: 12px/1 var(--mono); padding: 2px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; background: var(--surface); color: var(--fg); white-space: nowrap; }

/* Shell: one page scroll, 16px gutters, room for the fixed detail rail on wide screens */
#pb-shell { margin: 0 auto; width: min(var(--pb-width, 1600px), 100%); padding-block: 8px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: block; }
@media (min-width: 1141px) { html:not([data-railpos="top"]) #pb-shell { width: min(var(--pb-width, 1600px), calc(100% - 2 * var(--pb-band, 120px))); } }
html[data-pb-band] #pb-shell { width: min(var(--pb-width, 1600px), calc(100% - 2 * var(--pb-band, 0px))); }
#pb-top { display: contents; }   /* 0.3.3: no box of its own: its children (the header box, the list of shortcuts, the detail slider, the data-through block) are laid out in the shell, so the sticky list can stay pinned for the whole page */
/* 0.3.0: the "data through" block (PB_CONFIG.sources, freshness.placement). One source reads "Data through 30 Jan 2026". Several: a title, then each source as its name with its date under it, oldest first; a source behind the newest says so. A date never breaks inside itself and a name breaks only between words. Floating, the block is --pb-freshw wide (184 px, set by the script) and stays in view at the left or right edge, stacked above the detail slider when both are on one edge; when the window is too narrow or too short it joins the page flow in the header and covers nothing. */
.pb-fresh { font: 12.5px/1.4 var(--body); color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin: 8px 0; max-width: 100%; }
.pb-fresh .pb-fresh-t { font: 600 10.5px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; display: block; margin-bottom: 6px; }
.pb-fresh .pb-fresh-l { display: block; } .pb-fresh b { color: var(--fg); font-weight: 600; }
.pb-fresh .pb-date { white-space: nowrap; }
.pb-fresh .pb-srcs { display: flex; flex-wrap: wrap; gap: 8px 22px; }
.pb-fresh .pb-src { display: block; min-width: 0; }
.pb-fresh .pb-src-n { display: block; overflow-wrap: break-word; word-break: normal; hyphens: manual; }
.pb-fresh .pb-src-d { display: block; }
.pb-fresh .pb-fresh-note { display: block; font-size: 11.5px; overflow-wrap: break-word; }
.pb-fresh .pb-behind { color: var(--warn); font-weight: 600; display: block; font-size: 11.5px; overflow-wrap: break-word; }
.pb-fresh[data-float="right"], .pb-fresh[data-float="left"] { position: fixed; top: 12px; width: var(--pb-freshw, 184px); z-index: 20; margin: 0; box-shadow: 0 2px 12px rgba(0, 0, 0, .12); }
.pb-fresh[data-float="right"] .pb-srcs, .pb-fresh[data-float="left"] .pb-srcs { display: grid; gap: 8px; }
.pb-fresh[data-float="right"] { right: 8px; } .pb-fresh[data-float="left"] { left: 8px; }
#pb-shell > * { min-width: 0; }
#ah-panel-main { display: block; }
#ah-panel-main > * + * { margin-top: var(--pb-gap, 18px); }
#ah-panel-main h1 { font: 700 clamp(24px, 4vw, 34px)/1.15 var(--body); margin: 8px 0 0; text-wrap: balance; }
#ah-panel-main h2 { font: 650 20px/1.25 var(--body); margin: 26px 0 10px; }
#ah-panel-main h3 { font: 650 16px/1.3 var(--body); margin: 18px 0 8px; }
#ah-panel-main p { margin: 8px 0; }
/* 0.2.0 text blocks: a paragraph is as wide as the block it sits in (layout.text_blocks match); only measure holds it to a line length, and a reading page is already one narrow column */
#ah-panel-main :is(p, li, dd, dt, blockquote, figcaption, .pb-lead, .pb-small) { overflow-wrap: break-word; }
#ah-panel-main :is(code, .pb-key) { overflow-wrap: anywhere; }
html[data-pb-text="measure"]:not([data-pb-width="reading"]) #ah-panel-main :is(p, .lede, .intro, .pb-lead) { max-width: var(--pb-measure, 75ch); }   /* 0.3.0: layout.measure_ch */
html[data-pb-width="reading"] #ah-panel-main :is(p, .lede, .intro, .pb-lead) { max-width: none; }
#ah-panel-main code { font: 13px/1.5 var(--mono); }
.pb-lead { color: var(--muted); }
.pb-small { font-size: 13px; color: var(--muted); }
.pb-box { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }

/* Header (the author-status box) */
.ah { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font: 12.5px/1.45 var(--body); color: var(--muted); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; margin: 10px 0; background: var(--surface); }
.ah b { color: var(--fg); font-weight: 600; }
.ah .ah-uuid { font-family: var(--mono); font-size: 11.5px; overflow-wrap: anywhere; }
.ah .ah-st { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--fg); }
.ah .ah-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
.ah[data-live="green"] .ah-dot { background: var(--ok); }
.ah[data-live="amber"] .ah-dot { background: var(--warn); }
.ah .ah-note { flex-basis: 100%; font-size: 12px; }
.ah a { color: var(--accent); }
.ah .ah-gap { flex: 1 1 auto; }
.ah[data-hdr="name"] .ah-st, .ah[data-hdr="name"] #ah-uuid, .ah[data-hdr="name"] #ah-account, .ah[data-hdr="name"] #ah-mode, .ah[data-hdr="name"] #ah-qwrap, .ah[data-hdr="name"] #ah-note, .ah[data-hdr="off"] .ah-st, .ah[data-hdr="off"] #ah-by, .ah[data-hdr="off"] #ah-account, .ah[data-hdr="off"] #ah-mode, .ah[data-hdr="off"] #ah-qwrap, .ah[data-hdr="off"] #ah-note, .ah[data-hdr="off"] #pb-age { display: none; }
.pb-age { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; color: var(--fg); background: var(--bg); font-size: 12px; }
.pb-age[data-state="stale"] { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); font-weight: 600; }
.pb-gear { display: inline-flex; align-items: center; gap: 6px; font: 600 12.5px/1 var(--body); padding: 6px 10px; border: 1px solid var(--accent); border-radius: 8px; background: transparent; color: var(--accent); cursor: pointer; }
.pb-gear:hover, .pb-gear[aria-expanded="true"] { background: var(--accent-soft); }
.pb-gear svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: butt; }
/* 0.3.1: Shortcuts and Options repeated while the header buttons are out of view (reader.floating_menu). With the detail slider floating at the left, two small tabs are fixed at the top of the slider's own band (the same 96 px column, 72 px high together, with the band between them and the slider); the slider moves down to make room. With no side band (a narrow window, the slider pinned to the top) nothing floats over content: a thin strip is fixed at the top of the content column, and the page keeps matching top scroll padding so an anchor jump or a tab is not hidden under it. No animation. */
.pb-ftabs { display: none; }
.pb-ftabs[data-on="1"] { display: grid; }
.pb-ftabs[data-mode="float"] { position: fixed; left: 8px; top: 12px; width: 96px; gap: 4px; z-index: 20; }
.pb-ftabs[data-mode="strip"][data-on="1"] { display: flex; position: fixed; top: 0; z-index: 20; align-items: center; gap: 8px; height: 40px; padding: 5px 8px; background: var(--surface); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 10px 10px; box-shadow: 0 2px 10px rgba(0, 0, 0, .12); }
.pb-ftab { display: inline-flex; align-items: center; justify-content: center; gap: 5px; height: 34px; min-width: 0; font: 600 12px/1 var(--body); padding: 0 6px; border: 1px solid var(--accent); border-radius: 8px; background: var(--surface); color: var(--accent); cursor: pointer; white-space: nowrap; box-shadow: 0 2px 12px rgba(0, 0, 0, .12); }
.pb-ftab:hover, .pb-ftab[aria-expanded="true"] { background: var(--accent-soft); }
.pb-ftab svg { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: butt; }
.pb-ftabs[data-mode="strip"] .pb-ftab { height: 28px; padding: 0 10px; box-shadow: none; }
html[data-pb-ftmode="strip"] { scroll-padding-top: 48px; }
.pb-opt[data-beside] { border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 4px 24px rgba(0, 0, 0, .3); }
/* 0.3.3: the Shortcuts control (the tab, the header button, the ? key) toggles a list of the shortcuts on screen; there is no Shortcuts panel. The list is one box, #pb-flist, drawn from the one registry, and it hangs under the control: in the left band under the Shortcuts tab when that fits (data-place="float", fixed; the band grows to hold it), otherwise in the page flow directly under the header (data-place="flow") or, once the header has scrolled away, pinned under the strip or at the top of the content column (data-place="strip", sticky, so it takes its own height out of the page and pushes the content down instead of covering it). Three placements, one element, no animation. */
.pb-flist { z-index: 19; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; box-shadow: 0 2px 12px rgba(0, 0, 0, .12); font: 12px/1.35 var(--body); }
.pb-flist[data-place="float"] { position: fixed; left: 8px; top: var(--pb-flist-top, 116px); width: var(--pb-listw, 224px); max-height: var(--pb-flist-h, 300px); overflow-y: auto; }
.pb-flist[data-place="flow"], .pb-flist[data-place="strip"] { position: static; margin: 8px 0 12px; max-height: min(46vh, 420px); overflow-y: auto; overscroll-behavior: contain; }
.pb-flist[data-place="strip"] { position: sticky; top: var(--pb-flist-stick, 41px); }
html[data-pb-flist="strip"] { overflow-anchor: none; }
.pb-flist .pb-flist-t { font: 600 10.5px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.pb-flist-dl { margin: 0; display: grid; gap: 6px; }
.pb-flist[data-place="flow"] .pb-flist-dl, .pb-flist[data-place="strip"] .pb-flist-dl { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px 16px; }
.pb-flist-dl > div { display: grid; gap: 1px; align-content: start; }
.pb-flist-dl > div:not([data-wide]) { grid-template-columns: max-content minmax(0, 1fr); column-gap: 8px; align-items: baseline; }   /* a single key sits beside its words; a chord has the line to itself */
.pb-flist-dl dt { margin: 0; display: flex; flex-wrap: wrap; gap: 2px; align-items: center; }
.pb-flist-dl dd { margin: 0; color: var(--muted); overflow-wrap: break-word; }
.pb-flist kbd { font-size: 11px; padding: 1px 4px; }
.pb-flist .pb-nokey { color: var(--muted); font-style: italic; }
/* 0.3.3: Bind Shortcuts, a view inside the Options panel: one row per shortcut, a key button that waits for the next key, and the words that say why a key was refused */
.pb-bind-intro { margin: 8px 0 4px; }
.pb-bindlist { display: grid; gap: 0; }
.pb-bindrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
.pb-bindrow .pb-bind-l { font-size: 13px; overflow-wrap: break-word; }
.pb-opt .pb-bind-k { min-height: 32px; min-width: 76px; display: inline-flex; flex-wrap: wrap; gap: 2px; align-items: center; justify-content: center; padding: 3px 8px; border: 1px solid var(--accent); border-radius: 8px; background: var(--surface); color: var(--accent); cursor: pointer; font: 600 12px/1.2 var(--body); }
.pb-opt .pb-bind-k kbd { font-size: 11.5px; padding: 1px 5px; }
.pb-opt .pb-bind-k[data-cap="1"] { background: var(--accent-soft); }
.pb-bindrow .pb-bind-fixed { font-size: 12px; color: var(--muted); display: inline-flex; gap: 2px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.pb-bindrow .pb-bind-acts { grid-column: 1 / -1; display: flex; gap: 4px 12px; flex-wrap: wrap; }
.pb-opt .pb-bind-acts button { border: 0; padding: 0 2px; background: transparent; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; font-size: 12px; }
.pb-bindrow .pb-bind-m { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
.pb-bindrow .pb-bind-m:empty { display: none; }
.pb-bindrow .pb-bind-m[data-bad="1"] { color: var(--ask); font-weight: 600; }
.pb-bind-foot { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
/* 0.3.2: named tabs (PB_CONFIG.tabs). Content that no tab claims is the page intro and shows above the tab bar on every tab; each tab is a panel; the printed page shows every panel with its label as a heading. */
#pb-intro { display: block; }
#pb-intro > * + * { margin-top: var(--pb-gap, 18px); }
#pb-intro h1 { font: 700 clamp(24px, 4vw, 34px)/1.15 var(--body); margin: 8px 0 0; text-wrap: balance; }
#pb-intro p { margin: 8px 0; }
#pb-intro :is(p, li, dd, dt, blockquote) { overflow-wrap: break-word; }
.pb-tabpanel { display: block; min-width: 0; }
.pb-tabpanel > * + * { margin-top: var(--pb-gap, 18px); }
.pb-print-h { display: none; }
@media (max-width: 560px) { html[data-pb-tabs] .ah-tabs { gap: 4px; } html[data-pb-tabs] .ah-tabs button { padding: 6px 9px; font-size: .88rem; } }
/* 0.3.2: the Method tab: the include adds a small contents bar and some styling; every word of the Method tab is in the page source. */
.pb-method-nav { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font: 13px/1.4 var(--body); }
.pb-method-nav .pb-method-nav-t { font: 600 10.5px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.pb-method-nav a { color: var(--accent); }
[data-pb-method] > section { scroll-margin-top: 16px; }
[data-pb-method] h2:not(.pb-print-h) { border-top: 1px solid var(--line); padding-top: 14px; }
/* 0.3.1: a draft of text the reader typed and has not sent yet */
.pb-draft { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; font: 12px/1.4 var(--body); color: var(--muted); margin: 0; }
.pb-draft .pb-link { font-size: 12px; }
/* 0.3.1: in the parentheses form a figure that is not negative reserves the width of the closing parenthesis, so digits and percent signs line up down the column (an invisible generated character: not in the text, the copied CSV or what a screen reader says) */
.pb-table :is(td, th)[data-pb-pp]::after { content: ")"; visibility: hidden; }
.pb-table :is(td, th)[data-pb-pp]::after { content: ")" / ""; }
.pb-table[data-pb-stacked="1"] :is(td, th)[data-pb-pp]::after { content: none; }

/* Detail rail */
.ah-rail { position: fixed; left: 8px; top: 50%; transform: translateY(-50%); z-index: 20; display: grid; gap: 6px; justify-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px; width: 96px; box-shadow: 0 2px 12px rgba(0, 0, 0, .12); }
.ah-rail .t { font: 600 10px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ah-rail input[type="range"] { writing-mode: vertical-lr; direction: rtl; width: 22px; height: 110px; accent-color: var(--accent); margin: 2px 0; cursor: ns-resize; }
.ah-rail .lv { display: grid; gap: 2px; width: 100%; }
.ah-rail .lv button { font: 500 11.5px/1.2 var(--body); border: 1px solid transparent; background: transparent; color: var(--muted); border-radius: 6px; padding: 3px 4px; cursor: pointer; }
.ah-rail .lv button[aria-pressed="true"] { background: var(--accent); color: var(--bg); font-weight: 600; }
.ah-rail .hint { font-size: 10px; color: var(--muted); text-align: center; line-height: 1.4; }
