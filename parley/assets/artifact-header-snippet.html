<!-- Artifact header for any page a Claude Code session publishes. It carries four things: who wrote the page (the session's name and
     full id), whether that session is live to answer comments, whether the page was published headless, and a detail rail
     (Zero, Concise, Verbose, Exhaustive). It also carries the page theme: a palette named "default", with a Theme menu of
     Auto (follows the browser, the default), Dark and Light, always high contrast: every text color is at least 7:1 on the
     background and the surface, and every border at least 3:1.
     Copy parts 1 to 3; put the style block after the page's own color tokens so the palette wins, and use the
     tokens --bg --surface --fg --muted --line --accent --accent-soft --ask --ask-soft --ok for the page's own colors:
       1. the style block;
       2. the markup, first thing in the page content (before the page's own header);
       3. the script, at the end of the page. Fill AH: seat (the session's name), session (its full id), account,
          headless, questions.
     Part 4 is the Log tab scaffold at the end of this file, between its BEGIN and END marks. It is the standard for every
     artifact page that is not a parley; a page without it works as before. Its own comment says how to use it.
     Tag page elements l1, l2 or l3 for the lowest detail level that shows them (untagged shows always) and say in one
     line near the top what each level adds. The rail can sit on the left edge or pinned across the top (the reader's
     choice, remembered per browser), and "detail: false" in AH leaves it out for a page too small to need levels.
     Live status reads heartbeat/owner from the page's own db (declare the db capability); the owning session writes it on
     every check-in. Without db, or for a headless page, the bubble says no session is watching. -->
<style>
/* Palette "default" (data-ws). Auto follows the viewer's browser setting; Dark and Light pick the palette. */
:root[data-ws="default"] { --bg: #f7f8fa; --surface: #ffffff; --fg: #141414; --muted: #454545; --line: #6b7280; --accent: #0f4a80; --accent-soft: #e3ecf5; --ask: #951a0a; --ask-soft: #fbe6e3; --ok: #235521; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root[data-ws="default"]:not([data-ptheme="light"]):not([data-theme="light"]) { --bg: #000000; --surface: #0d1117; --fg: #ffffff; --muted: #c8c8c8; --line: #8b949e; --accent: #6db8ff; --accent-soft: #0b2744; --ask: #f38518; --ask-soft: #3a1f05; --ok: #89d185; color-scheme: dark; } }
:root[data-ws="default"][data-ptheme="dark"], :root[data-ws="default"][data-theme="dark"]:not([data-ptheme="light"]) { --bg: #000000; --surface: #0d1117; --fg: #ffffff; --muted: #c8c8c8; --line: #8b949e; --accent: #6db8ff; --accent-soft: #0b2744; --ask: #f38518; --ask-soft: #3a1f05; --ok: #89d185; color-scheme: dark; }
.themepick { font: 12px/1 inherit; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.themepick select, .ah select { font: 12px inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
html, body { background: var(--bg); color: var(--fg); }
.ah { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font: 12.5px/1.45 var(--body, inherit); color: var(--muted, #666); border: 1px solid var(--line, #ccc); border-radius: 10px; padding: 7px 12px; margin: 10px 0; background: var(--surface, transparent); }
.ah b { color: var(--fg, inherit); font-weight: 600; }
.ah .ah-uuid { font-family: var(--mono, ui-monospace, Consolas, monospace); font-size: 11.5px; overflow-wrap: anywhere; }
.ah .ah-st { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--fg, inherit); }
.ah .ah-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted, #999); flex: none; }
.ah[data-live="live"] .ah-dot { background: var(--ok, #2d6a2a); }
.ah[data-live="idle"] .ah-dot { background: var(--accent, #b07a00); }
.ah[data-live="grey"] .ah-dot { background: var(--muted, #999); }
.ah .ah-note { flex-basis: 100%; font-size: 12px; }
.ah a { color: var(--accent, inherit); }
.ah-rail { position: fixed; left: 8px; top: 50%; transform: translateY(-50%); z-index: 20; display: grid; gap: 6px; justify-items: center; background: var(--surface, var(--bg, #fff)); border: 1px solid var(--line, #ccc); border-radius: 12px; padding: 10px 6px; width: 96px; box-shadow: 0 2px 12px rgba(0,0,0,.10); }
.ah-rail .t { font: 600 10px/1 var(--mono, monospace); letter-spacing: .08em; text-transform: uppercase; color: var(--muted, #666); }
.ah-rail input[type="range"] { writing-mode: vertical-lr; direction: rtl; width: 22px; height: 110px; accent-color: var(--accent, #555); margin: 2px 0; cursor: ns-resize; }
.ah-rail .lv { display: grid; gap: 2px; width: 100%; }
.ah-rail .lv button { font: 500 11.5px/1.2 inherit; border: 1px solid transparent; background: transparent; color: var(--muted, #666); border-radius: 6px; padding: 3px 4px; cursor: pointer; }
.ah-rail .lv button[aria-pressed="true"] { background: var(--accent, #555); color: var(--bg, #fff); font-weight: 600; }
.ah-rail .hint { font-size: 10px; color: var(--muted, #666); text-align: center; line-height: 1.25; }
@media (max-width: 1140px) { .ah-rail { position: static; transform: none; width: auto; grid-auto-flow: column; align-items: center; gap: 10px; padding: 6px 10px; box-shadow: none; margin: 8px 0; } .ah-rail input[type="range"] { writing-mode: horizontal-tb; direction: ltr; width: 110px; height: 22px; cursor: ew-resize; } .ah-rail .lv { grid-auto-flow: column; } .ah-rail .hint { display: none; } }
.ah-rail[hidden] { display: none; }
.ah-rail .railpos { font-weight: 600; font-size: 10.5px; line-height: 1.2; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 6px; padding: 3px 4px; cursor: pointer; }
/* Pin to top (viewer choice, localStorage parley-railpos): the narrow-screen horizontal layout, applied on desktop under html[data-railpos="top"] */
html[data-railpos="top"] .ah-rail { position: static; transform: none; width: auto; grid-auto-flow: column; align-items: center; gap: 10px; padding: 6px 10px; box-shadow: none; margin: 8px 0; }
html[data-railpos="top"] .ah-rail input[type="range"] { writing-mode: horizontal-tb; direction: ltr; width: 110px; height: 22px; cursor: ew-resize; }
html[data-railpos="top"] .ah-rail .lv { grid-auto-flow: column; }
html[data-railpos="top"] .ah-rail .hint { display: none; }
@media (max-width: 1140px) { .ah-rail .railpos { display: none; } }
body[data-lvl="0"] .l1, body[data-lvl="0"] .l2, body[data-lvl="0"] .l3, body[data-lvl="1"] .l2, body[data-lvl="1"] .l3, body[data-lvl="2"] .l3 { display: none !important; }
</style>

<div class="ah" id="ah" data-artifact-header="1" data-live="grey" role="note" aria-label="Who made this page and whether it is watched">
  <span class="ah-st"><span class="ah-dot" aria-hidden="true"></span><span id="ah-status">Author status unknown</span></span>
  <span>Authored by <b id="ah-seat">?</b> <span class="ah-uuid" id="ah-uuid"></span></span>
  <span id="ah-home"></span>
  <span id="ah-mode"></span>
  <span id="ah-qwrap">Questions: <a id="ah-q" href="#" target="_blank" rel="noopener">its parley page</a></span>
  <label class="themepick">Theme <select id="ws-theme" data-ws-theme aria-label="Theme"><option value="auto">Auto</option><option value="dark">Dark</option><option value="light">Light</option></select></label>
  <span class="ah-note" id="ah-note"></span>
</div>
<div class="ah-rail" id="ah-rail" role="group" aria-label="Level of detail">
  <span class="t">Detail</span>
  <div class="lv">
    <button type="button" data-lvl="3" aria-pressed="false">Exhaustive</button>
    <button type="button" data-lvl="2" aria-pressed="false">Verbose</button>
    <button type="button" data-lvl="1" aria-pressed="true">Concise</button>
    <button type="button" data-lvl="0" aria-pressed="false">Zero</button>
  </div>
  <input type="range" id="ah-lvl" min="0" max="3" step="1" value="1" aria-label="Level of detail">
  <span class="hint">scroll here or click</span>
</div>

<script>
/* Fill these when publishing. session is the authoring session's full id; headless is true when the page was
   published by a script (claude -p), where no session is woken by comments. */
/* detail: false turns the detail rail off and shows everything (level 3); use it for pages too small to need levels, such as a one-line moved notice. Absent or true keeps the rail. */
var AH = { seat: "my-session", session: "00000000-0000-0000-0000-000000000000", account: "", headless: false,
           questions: "", published: "YYYY-MM-DD HH:MM UTC", period_min: 50 };
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var box = $("ah");
  /* theme: Auto (default) follows the viewer's browser, Dark and Light pick the palette */
  var root = document.documentElement, pick = $("ws-theme"), tv = "auto";
  root.setAttribute("data-ws", "default");
  try { tv = localStorage.getItem("parley-theme") || "auto"; } catch (e) {}
  if (["auto", "dark", "light"].indexOf(tv) < 0) tv = "auto";
  function applyTheme(x) { if (x === "auto") root.removeAttribute("data-ptheme"); else root.setAttribute("data-ptheme", x); }
  applyTheme(tv);
  if (pick) { pick.value = tv; pick.addEventListener("change", function () { applyTheme(pick.value); try { localStorage.setItem("parley-theme", pick.value); } catch (e) {} }); }
  $("ah-seat").textContent = AH.seat;
  $("ah-uuid").textContent = AH.session;
  $("ah-home").textContent = AH.account ? AH.account + " account" : "";
  $("ah-mode").textContent = (AH.headless ? "published headless" : "published from a live session") + (AH.published ? " " + AH.published : "");
  if (AH.questions) $("ah-q").href = AH.questions; else $("ah-qwrap").hidden = true;
  var ask = AH.questions ? " Ask on " + AH.seat + "'s parley instead." : "";
  function show(state, text, note) { box.setAttribute("data-live", state); $("ah-status").textContent = text; $("ah-note").textContent = note || ""; }
  function hhmm(d) { return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
  var grey = "No live session watches comments here. A comment sent to Claude would open a new session with no context." + ask;
  if (AH.headless) { show("grey", "Published headless: not watched", grey); }
  else { show("grey", "Checking the author", ""); }
  function judge(hb) {
    if (!hb || !hb.last_seen) { show("grey", "Author not watching", grey); return; }
    var seen = new Date(hb.last_seen), per = +(hb.period_min || AH.period_min || 50), age = (Date.now() - seen) / 60000;
    if (hb.watching_comments === false) { show("grey", "Author not watching", grey); }
    else if (age <= per + 10) { show("live", "Author live: watches comments", (hb.title || AH.seat) + " last checked in " + hhmm(seen) + "; a comment sent to Claude reaches it" + (hb.next_tick ? ", next check " + hb.next_tick : "") + "."); }
    else if (age <= per * 3) { show("idle", "Author idle since " + hhmm(seen), "A comment sent to Claude reaches it when it next wakes; a reply may wait." + ask); }
    else { show("grey", "Author gone quiet since " + hhmm(seen), grey); }
  }
  if (!AH.headless) {
    (async function () {
      var db = null;
      try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
      if (!db) { show("grey", "Author status not wired on this page", grey); return; }
      try { db.doc("heartbeat/owner").onSnapshot(function (s) { judge(s.exists ? s.data() : null); }, function () { judge(null); }); }
      catch (e) { judge(null); }
    })();
  }
  /* detail rail: buttons, the range, the scroll wheel over the rail and arrow keys; remembered per browser */
  var NAMES = ["zero", "concise", "verbose", "exhaustive"], lvl = 1, rail = $("ah-rail"), range = $("ah-lvl");
  if (AH.detail === false) { rail.hidden = true; document.body.setAttribute("data-lvl", "3"); return; } /* per-page off switch: no rail, level 3 */
  function setLvl(n, save) {
    n = Math.max(0, Math.min(3, n | 0)); lvl = n; document.body.setAttribute("data-lvl", String(n)); range.value = String(n);
    rail.querySelectorAll("[data-lvl]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.lvl) === String(n) ? "true" : "false"); });
    if (save) { try { localStorage.setItem("parley-detail", NAMES[n]); } catch (e) {} }
  }
  rail.addEventListener("click", function (ev) { var b = ev.target.closest("[data-lvl]"); if (b) setLvl(+b.dataset.lvl, true); });
  range.addEventListener("input", function () { setLvl(+range.value, true); });
  rail.addEventListener("wheel", function (ev) { ev.preventDefault(); setLvl(lvl + (ev.deltaY < 0 ? 1 : -1), true); }, { passive: false });
  var start = 1; try { var sv = localStorage.getItem("parley-detail"); if (sv && NAMES.indexOf(sv) >= 0) start = NAMES.indexOf(sv); } catch (e) {}
  setLvl(start, false);
  var pos = "side"; try { if (localStorage.getItem("parley-railpos") === "top") pos = "top"; } catch (e) {}
  var pinb = document.createElement("button"); pinb.type = "button"; pinb.className = "railpos"; rail.appendChild(pinb);
  function setPos(p, save) { pos = p; root.setAttribute("data-railpos", p); pinb.textContent = p === "top" ? "Pin to side" : "Pin to top"; pinb.setAttribute("aria-pressed", p === "top" ? "true" : "false"); if (save) { try { localStorage.setItem("parley-railpos", p); } catch (e) {} } }
  pinb.addEventListener("click", function () { setPos(pos === "top" ? "side" : "top", true); });
  setPos(pos, false);
})();
</script>

<!-- ===== BEGIN Log tab scaffold (part 4 of this snippet). =====
     The standard: every artifact page that is not a parley carries a Log tab, so that other readers can see what was asked and
     decided: each question or comment in the asker's own words, the answer and what changed, newest first, then a version
     history. A parley does not carry it: its conversations live on its cards.
     How to use it:
       1. Put the three blocks below (style, markup, script) after the artifact header markup. Move the page's own content
          inside <div id="ah-panel-main">; nothing else about the page changes.
       2. Fill AHLOG. qa holds one entry per question or comment, newest first: when, who asked, the question in
          their own words, the answer, and what changed on the page (name the version). versions holds one row per published
          version, newest first.
       3. Update AHLOG in the same publish that answers the comment. The address of the page with #log at its end opens the Log.
     Keep off the Log anything the page's readers should not see: it is as public as the page. -->
<style>
.ah-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 14px; border-bottom: 2px solid var(--line, #ccc); }
.ah-tabs button { font: inherit; font-size: .95rem; padding: 8px 14px; border: 1px solid var(--line, #ccc); border-bottom: 0; border-radius: 8px 8px 0 0; background: var(--surface, transparent); color: var(--fg, inherit); cursor: pointer; }
.ah-tabs button[aria-selected="true"] { background: var(--accent, #555); color: var(--bg, #fff); font-weight: 700; }
.ah-tabs button:focus-visible, .ah-log input:focus-visible, .ah-log th:focus-visible { outline: 2px solid var(--accent, #555); outline-offset: 2px; }
.ah-tabs .n { font-size: .8em; margin-left: 6px; opacity: .85; }
.ah-log { display: grid; gap: 14px; }
.ah-log h2, .ah-log h3 { margin: 0; }
.ah-log .lead, .ah-log .none { color: var(--muted, #666); margin: 0; }
.ah-log input[type=search] { width: 100%; box-sizing: border-box; font: inherit; padding: 7px 10px; border: 1px solid var(--line, #ccc); border-radius: 6px; background: var(--surface, transparent); color: var(--fg, inherit); }
.ah-log ol.qa { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.ah-log ol.qa li { border: 1px solid var(--line, #ccc); border-radius: 8px; padding: 10px 14px; background: var(--surface, transparent); display: grid; gap: 6px; min-width: 0; }
.ah-log .meta { font-size: .85em; color: var(--muted, #666); }
.ah-log .q { white-space: pre-wrap; overflow-wrap: anywhere; border-left: 3px solid var(--ask, #a35f00); padding-left: 10px; font-weight: 600; }
.ah-log .a, .ah-log .c { overflow-wrap: anywhere; }
.ah-log .lbl { font-weight: 600; color: var(--muted, #666); }
.ah-log .box { overflow-x: auto; border: 1px solid var(--line, #ccc); border-radius: 8px; background: var(--surface, transparent); }
.ah-log table { border-collapse: collapse; width: 100%; }
.ah-log th, .ah-log td { text-align: left; padding: 8px 12px; border-top: 1px solid var(--line, #ccc); vertical-align: top; }
.ah-log thead th { border-top: 0; cursor: pointer; user-select: none; white-space: nowrap; }
.ah-log thead th[aria-sort=ascending]::after { content: " \2191"; }
.ah-log thead th[aria-sort=descending]::after { content: " \2193"; }
</style>

<nav class="ah-tabs" role="tablist" aria-label="Page sections">
  <button type="button" role="tab" id="ah-tab-main" aria-controls="ah-panel-main" aria-selected="true">Page</button>
  <button type="button" role="tab" id="ah-tab-log" aria-controls="ah-panel-log" aria-selected="false" tabindex="-1">Log<span class="n" id="ah-log-n"></span></button>
</nav>
<div id="ah-panel-main" role="tabpanel" aria-labelledby="ah-tab-main" tabindex="0">
  <!-- The page's own content goes here. -->
</div>
<div id="ah-panel-log" class="ah-log" role="tabpanel" aria-labelledby="ah-tab-log" tabindex="0" hidden>
  <h2>Log</h2>
  <p class="lead">Every question asked on this page, what was answered and what changed, newest first, then the version history.</p>
  <input type="search" id="ah-log-filter" placeholder="Filter the log" aria-label="Filter the log">
  <h3>Questions and answers</h3>
  <ol class="qa" id="ah-log-qa"></ol>
  <h3>Versions</h3>
  <div class="box"><table>
    <thead><tr><th scope="col" tabindex="0">Version</th><th scope="col" tabindex="0">When</th><th scope="col" tabindex="0">What changed</th></tr></thead>
    <tbody id="ah-log-versions"></tbody>
  </table></div>
</div>

<script>
/* Fill these when publishing, newest first. Text is shown as written, never as markup.
   qa:       { when: "2025-01-15 09:00 UTC", who: "Reviewer", question: "their words, verbatim", answer: "what was answered", changed: "what changed on the page, with the version" }
   versions: { version: "v1.2", when: "2025-01-15 09:30 UTC", changed: "what this version changed" } */
var AHLOG = { main: "Page", qa: [], versions: [] };
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var el = function (tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  var tabs = [[$("ah-tab-main"), $("ah-panel-main")], [$("ah-tab-log"), $("ah-panel-log")]];
  if (!tabs[0][0] || !tabs[1][0]) return;
  tabs[0][0].textContent = AHLOG.main || "Page";
  var qa = AHLOG.qa || [], versions = AHLOG.versions || [];
  if (qa.length) $("ah-log-n").textContent = String(qa.length);
  function show(i, focus) {
    tabs.forEach(function (t, k) { var on = k === i; t[0].setAttribute("aria-selected", on ? "true" : "false"); t[0].tabIndex = on ? 0 : -1; t[1].hidden = !on; });
    if (focus) tabs[i][0].focus();
  }
  tabs.forEach(function (t, k) {
    t[0].addEventListener("click", function () { show(k, false); });
    t[0].addEventListener("keydown", function (ev) {
      if (ev.key === "ArrowRight" || ev.key === "ArrowLeft") { ev.preventDefault(); show(k === 0 ? 1 : 0, true); }
      if (ev.key === "Home") { ev.preventDefault(); show(0, true); }
      if (ev.key === "End") { ev.preventDefault(); show(1, true); }
    });
  });
  var filter = $("ah-log-filter"), qaHost = $("ah-log-qa"), vHost = $("ah-log-versions"), sortCol = -1, dir = 1;
  var vKeys = ["version", "when", "changed"];
  function line(label, cls, text) { var d = el("div", cls); d.append(el("span", "lbl", label + " "), String(text)); return d; }
  function draw() {
    var f = filter.value.trim().toLowerCase();
    var hit = function (o) { return !f || Object.keys(o).map(function (k) { return String(o[k] == null ? "" : o[k]); }).join(" ").toLowerCase().indexOf(f) >= 0; };
    var qs = qa.filter(hit);
    qaHost.replaceChildren.apply(qaHost, qs.map(function (x) {
      var li = el("li");
      li.append(el("div", "meta", [x.when, x.who].filter(Boolean).join(" · ")), el("div", "q", x.question == null ? "" : String(x.question)));
      if (x.answer) li.append(line("Answer:", "a", x.answer));
      if (x.changed) li.append(line("What changed:", "c", x.changed));
      return li;
    }));
    if (!qs.length) qaHost.append(el("li", "none", qa.length ? "No entry matches the filter." : "No questions yet."));
    var vs = versions.filter(hit);
    if (sortCol >= 0) vs = vs.slice().sort(function (a, b) { return String(a[vKeys[sortCol]] || "").localeCompare(String(b[vKeys[sortCol]] || ""), undefined, { numeric: true }) * dir; });
    vHost.replaceChildren.apply(vHost, vs.map(function (x) { var tr = el("tr"); vKeys.forEach(function (k) { tr.append(el("td", null, x[k] == null ? "" : String(x[k]))); }); return tr; }));
    if (!vs.length) { var tr = el("tr"); var td = el("td", "none", versions.length ? "No version matches the filter." : "No versions recorded yet."); td.colSpan = 3; tr.append(td); vHost.append(tr); }
  }
  filter.addEventListener("input", draw);
  Array.prototype.forEach.call(vHost.parentNode.querySelectorAll("thead th"), function (th, i) {
    var go = function () { dir = sortCol === i ? -dir : 1; sortCol = i; Array.prototype.forEach.call(th.parentNode.children, function (x) { x.removeAttribute("aria-sort"); }); th.setAttribute("aria-sort", dir > 0 ? "ascending" : "descending"); draw(); };
    th.addEventListener("click", go);
    th.addEventListener("keydown", function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); go(); } });
  });
  draw();
  function fromHash() { if (location.hash === "#log") show(1, false); }
  fromHash(); window.addEventListener("hashchange", fromHash);
})();
</script>
<!-- ===== END Log tab scaffold ===== -->
